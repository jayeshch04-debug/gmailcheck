name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[test]" pyinstaller

      - name: Test
        run: pytest -q

      - name: Build exe
        run: pyinstaller --onefile --console --name gmailcheck launcher.py

      - name: Assemble GmailCheck folder
        shell: pwsh
        run: |
          $out = "GmailCheck"
          New-Item -ItemType Directory -Force $out, "$out/emails", "$out/success", "$out/failed" | Out-Null
          Copy-Item dist/gmailcheck.exe $out/
          Copy-Item packaging/accounts.csv $out/
          Copy-Item packaging/README.txt $out/
          Copy-Item packaging/emails/example.txt $out/emails/
          Compress-Archive -Path $out -DestinationPath GmailCheck-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GmailCheck-windows
          path: GmailCheck

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GmailCheck-windows.zip
